name: Rust build cache
description: Refresh a Rust compilation profile cache on each revision
inputs:
  profile:
    description: Cargo output profile (debug or release)
    required: true
runs:
  using: composite
  steps:
    - id: toolchain
      shell: bash
      run: |
        fingerprint=$( { rustc -vV; cargo -V; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          crates/native-core/target/${{ inputs.profile }}
        # Immutable entries must advance with the source, not only Cargo.lock.
        # Restore the last compatible revision; Cargo checks source freshness.
        key: rust-v3-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('crates/native-core/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          rust-v3-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('crates/native-core/Cargo.lock') }}-
