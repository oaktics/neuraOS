name: native-development
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      lightweight:
        description: Run the staging Ubuntu checks instead of the full macOS suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: node scripts/ci/changes.mjs
  verify:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ${{ (github.event_name == 'push' || inputs.lightweight) && 'ubuntu-latest' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Install the shell used by PTY integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          test -x /bin/zsh
          # Avoid the first-login configuration wizard consuming PTY test input.
          touch "$HOME/.zshrc"
      - run: pnpm test
      - run: node --test tests/release/*.test.mjs
      - if: github.event_name != 'push' && !inputs.lightweight
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - if: github.event_name != 'push' && !inputs.lightweight
        run: pnpm test:macos
      - if: github.event_name != 'push' && !inputs.lightweight
        run: pnpm build
      - if: github.event_name != 'push' && !inputs.lightweight
        run: node scripts/native/release/package.mjs
      - if: github.event_name != 'push' && !inputs.lightweight
        run: node scripts/native/release/smoke.mjs
      - name: Retain crash symbols
        if: github.event_name != 'push' && !inputs.lightweight
        uses: actions/upload-artifact@v4
        with:
          name: neuraOS-symbols-arm64
          path: apps/macos/dist/neuraOS.app.dSYM
          retention-days: 90
  macos:
    # A manual lightweight run must not satisfy the PR's full macOS gate.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.lightweight && 'ubuntu-check' || 'macos' }}
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation or documentation-only changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$VERIFY_RESULT" = success
          else
            test "$REQUIRED" = false
            test "$VERIFY_RESULT" = skipped
          fi
