name: native-development
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: node scripts/ci/changes.mjs
  rust:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
      - run: cargo test --locked --manifest-path crates/native-core/Cargo.toml --lib --tests
      - run: cargo build --release --locked --manifest-path crates/native-core/Cargo.toml
      - name: Upload release daemon
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: native-daemon
          path: crates/native-core/target/release/neura-native-core
          retention-days: 1
      - run: pnpm install --frozen-lockfile
      - name: Verify native HTTP protocol and native provider MCP
        run: node --test tests/native-rust/protocol.test.mjs tests/native-rust/setup-lifecycle.test.mjs tests/native-rust/pty-crash.test.mjs tests/native-rust/migration.test.mjs tests/native/provider-native-mcp.test.mjs tests/native/provider-process-tree.test.mjs tests/native/provider-daemon-parallel.test.mjs tests/native/provider-probe-retry.test.mjs tests/native/task-control.test.mjs
        env:
          NEURA_NATIVE_DAEMON: crates/native-core/target/release/neura-native-core
  node:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tests/release/*.test.mjs
  swift:
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/native-cache
        with:
          profile: debug
      - run: pnpm test:macos --force-resolved-versions
  package:
    needs: [changes, rust]
    if: needs.changes.outputs.required == 'true' && github.event_name != 'push'
    runs-on: macos-15
    env:
      NEURA_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-daemon
          path: crates/native-core/target/release
      - run: chmod +x crates/native-core/target/release/neura-native-core
      - run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/native-cache
        with:
          profile: release
      - run: pnpm build
        env:
          NEURA_SKIP_RUST_BUILD: '1'
      - run: node scripts/native/release/package.mjs
      - run: node scripts/native/release/smoke.mjs
      - run: node scripts/native/chromium/download-smoke.mjs
      - name: Build isolated browser fixture
        run: node scripts/native/build.mjs
        env:
          NEURA_SKIP_RUST_BUILD: '1'
          NEURA_SKIP_SWIFT_BUILD: '1'
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Verify browser MCP against packaged CEF
        run: pnpm exec tsx scripts/native/chromium/browser-smoke.ts
        env:
          NEURA_BROWSER_SMOKE_DAEMON: crates/native-core/target/release/neura-native-core
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Retain browser fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-evidence
          path: |
            /tmp/neura-browser-ci/evidence.json
            /tmp/neura-browser-ci/app.log
            /tmp/neura-browser-ci/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: neuraOS-symbols-arm64
          path: apps/macos/dist/neuraOS.app.dSYM
          retention-days: 1
  macos:
    if: always()
    needs: [changes, rust, node, swift, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          RUST_RESULT: ${{ needs.rust.result }}
          NODE_RESULT: ${{ needs.node.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
            test "$NODE_RESULT" = success
            if [ "$EVENT_NAME" = push ]; then
              test "$SWIFT_RESULT" = skipped
              test "$PACKAGE_RESULT" = skipped
            else
              test "$SWIFT_RESULT" = success
              test "$PACKAGE_RESULT" = success
            fi
          else
            test "$REQUIRED" = false
            for result in "$RUST_RESULT" "$NODE_RESULT" "$SWIFT_RESULT" "$PACKAGE_RESULT"; do
              test "$result" = skipped
            done
          fi
