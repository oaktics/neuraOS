name: native-development
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: node scripts/ci/changes.mjs
  verify:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    env:
      NEURA_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/native-core/target
          key: native-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/native-core/Cargo.lock') }}
      - run: cargo test --locked --manifest-path crates/native-core/Cargo.toml --lib --tests
      - run: cargo build --release --locked --manifest-path crates/native-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Verify native HTTP protocol and native provider MCP
        run: node --test tests/native-rust/protocol.test.mjs tests/native-rust/setup-lifecycle.test.mjs tests/native-rust/pty-crash.test.mjs tests/native/provider-native-mcp.test.mjs tests/native/provider-process-tree.test.mjs
        env:
          NEURA_NATIVE_DAEMON: crates/native-core/target/release/neura-native-core
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tests/release/*.test.mjs
      - if: github.event_name != 'push'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - if: github.event_name != 'push'
        uses: ./.github/actions/native-cache
      - if: github.event_name != 'push'
        run: pnpm test:macos --force-resolved-versions
      - if: github.event_name != 'push'
        run: pnpm build
      - if: github.event_name != 'push'
        run: node scripts/native/release/package.mjs
      - if: github.event_name != 'push'
        run: node scripts/native/release/smoke.mjs
      - if: github.event_name != 'push'
        run: node scripts/native/chromium/download-smoke.mjs
      - name: Build isolated browser fixture
        if: github.event_name != 'push'
        run: node scripts/native/build.mjs
        env:
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Verify browser MCP against packaged CEF
        if: github.event_name != 'push'
        run: pnpm exec tsx scripts/native/chromium/browser-smoke.ts
        env:
          NEURA_BROWSER_SMOKE_DAEMON: crates/native-core/target/release/neura-native-core
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Retain browser fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-evidence
          path: |
            /tmp/neura-browser-ci/evidence.json
            /tmp/neura-browser-ci/app.log
            /tmp/neura-browser-ci/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain crash symbols
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: neuraOS-symbols-arm64
          path: apps/macos/dist/neuraOS.app.dSYM
          retention-days: 1
  macos:
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation or documentation-only changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$VERIFY_RESULT" = success
          else
            test "$REQUIRED" = false
            test "$VERIFY_RESULT" = skipped
          fi
