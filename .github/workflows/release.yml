name: native-release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  # Main keeps the running release and only the newest pending run.
  # Older pending runs may be replaced even when cancellation is false.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false) | select(.tagName | test("^native-[0-9]+$"))] | sort_by(.tagName | ltrimstr("native-") | tonumber) | last | .tagName // empty')
            if [ -n "$tag" ]; then
              CI_RELEASE_BASE=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
              export CI_RELEASE_BASE
            fi
          fi
          node scripts/ci/changes.mjs --release
  native-build:
    needs: changes
    if: needs.changes.outputs.required == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    env:
      NEURA_SIGN_IDENTITY: ${{ github.event_name == 'pull_request' && '-' || vars.APPLE_SIGN_IDENTITY }}
      NEURA_REQUIRE_DEVELOPER_ID: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/native-core/target
          key: native-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/native-core/Cargo.lock') }}
      - run: cargo test --locked --manifest-path crates/native-core/Cargo.toml --lib --tests
      - run: cargo build --release --locked --manifest-path crates/native-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Verify native HTTP protocol and native provider MCP
        run: node --test tests/native-rust/protocol.test.mjs tests/native-rust/setup-lifecycle.test.mjs tests/native-rust/pty-crash.test.mjs tests/native-rust/migration.test.mjs tests/native/provider-native-mcp.test.mjs tests/native/provider-process-tree.test.mjs
        env:
          NEURA_NATIVE_DAEMON: crates/native-core/target/release/neura-native-core
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tests/release/*.test.mjs
      - run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/native-cache
      - run: pnpm test:macos --force-resolved-versions
      - name: Import release certificate and notarization credentials
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          node scripts/native/signing/ci-keychain.mjs setup
          echo "NEURA_SIGN_KEYCHAIN=$RUNNER_TEMP/neura-signing.keychain-db" >> "$GITHUB_ENV"
      - run: pnpm build
        env:
          NEURA_BUILD_NUMBER: ${{ github.run_number }}
      - run: node scripts/native/chromium/smoke.mjs
      - run: node scripts/native/release/package.mjs
      - run: node scripts/native/release/smoke.mjs
      - run: node scripts/native/chromium/download-smoke.mjs
      - name: Build isolated browser fixture
        run: node scripts/native/build.mjs
        env:
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Verify browser MCP against packaged CEF
        run: pnpm exec tsx scripts/native/chromium/browser-smoke.ts
        env:
          NEURA_BROWSER_SMOKE_DAEMON: crates/native-core/target/release/neura-native-core
          NEURA_APP_OUTPUT: apps/macos/dist/browser-fixture/neuraOS.app
          NEURA_APP_ID: com.neuraos.browser-smoke.ci
          NEURA_DEV_DATA_DIR: /tmp/neura-browser-ci
          NEURA_DEV_PORT: '44319'
      - name: Retain browser fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-evidence
          path: |
            /tmp/neura-browser-ci/evidence.json
            /tmp/neura-browser-ci/app.log
            /tmp/neura-browser-ci/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: neuraOS-symbols-arm64
          path: apps/macos/dist/neuraOS.app.dSYM
          retention-days: 1
      - name: Notarize and staple release
        if: github.event_name != 'pull_request'
        env:
          NEURA_NOTARY_PROFILE: neura-release
        run: node scripts/native/signing/notarize.mjs
      - name: Remove release keychain
        if: always() && github.event_name != 'pull_request'
        run: node scripts/native/signing/ci-keychain.mjs cleanup
      - name: Archive
        if: github.event_name != 'pull_request'
        run: |
          test "$(node -p process.arch)" = 'arm64'
          ditto -c -k --sequesterRsrc --keepParent apps/macos/dist/neuraOS.app neuraOS-darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: neuraOS-arm64
          path: neuraOS-darwin-arm64.zip
          compression-level: 0
          retention-days: 1
  build:
    if: always()
    needs: [changes, native-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful release validation or documentation-only changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          BUILD_RESULT: ${{ needs.native-build.result }}
          ALLOWED_REF: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
          if [ "$REQUIRED" = true ] && [ "$ALLOWED_REF" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.native-build.result == 'success'
    needs: [build, native-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neuraOS-arm64
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: native-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          latest=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false) | .tagName | select(test("^native-[0-9]+$")) | ltrimstr("native-") | tonumber] | max // 0')
          if [ "$latest" -ge "${RELEASE_TAG#native-}" ]; then
            echo "This release or a newer build is already published."
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT" --draft --title "neuraOS $RELEASE_TAG" --notes "Built from main at $COMMIT. Apple Silicon Macs only; Intel builds are no longer provided. Includes the macOS app and native Rust Daemon; no Node.js runtime is required. Save your work before updating: terminals restart."
          fi
          gh release upload "$RELEASE_TAG" --clobber neuraOS-darwin-arm64.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
