name: native-release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  # Main keeps the running release and only the newest pending run.
  # Older pending runs may be replaced even when cancellation is false.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: node scripts/ci/changes.mjs
  native-build:
    needs: changes
    if: needs.changes.outputs.required == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tests/release/*.test.mjs
      - run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: pnpm test:macos
      - run: pnpm build
        env:
          NEURA_BUILD_NUMBER: ${{ github.run_number }}
      - run: node scripts/native/chromium/smoke.mjs
      - run: node scripts/native/release/package.mjs
      - run: node scripts/native/release/smoke.mjs
      - name: Retain crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: neuraOS-symbols-arm64
          path: apps/macos/dist/neuraOS.app.dSYM
          retention-days: 90
      - name: Archive
        run: |
          test "$(node -p process.arch)" = 'arm64'
          ditto -c -k --sequesterRsrc --keepParent apps/macos/dist/neuraOS.app neuraOS-darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neuraOS-arm64
          path: neuraOS-darwin-arm64.zip
          retention-days: 7
  build:
    if: always()
    needs: [changes, native-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful release validation or documentation-only changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          BUILD_RESULT: ${{ needs.native-build.result }}
          ALLOWED_REF: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
          if [ "$REQUIRED" = true ] && [ "$ALLOWED_REF" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.native-build.result == 'success'
    needs: [build, native-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neuraOS-arm64
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: native-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          latest=$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft == false) | .tagName | select(test("^native-[0-9]+$")) | ltrimstr("native-") | tonumber] | max // 0')
          if [ "$latest" -ge "${RELEASE_TAG#native-}" ]; then
            echo "This release or a newer build is already published."
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$COMMIT" --draft --title "neuraOS $RELEASE_TAG" --notes "Built from main at $COMMIT. Apple Silicon Macs only; Intel builds are no longer provided. Includes the macOS app, Node.js and Daemon. Save your work before updating: terminals restart."
          fi
          gh release upload "$RELEASE_TAG" --clobber neuraOS-darwin-arm64.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
