name: update-worker
on:
  push:
    branches: [main]
    paths: ['infra/update-worker/**', '.github/workflows/update-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: node --test tests/release/updates.test.mjs
      - name: Deploy Worker
        working-directory: infra/update-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.0 deploy
