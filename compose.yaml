services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neura_admin
      POSTGRES_PASSWORD: ${NEURA_POSTGRES_PASSWORD:?set NEURA_POSTGRES_PASSWORD}
      POSTGRES_DB: neuraos
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neura_admin -d neuraos"]
      interval: 5s
      retries: 10
volumes:
  postgres:
